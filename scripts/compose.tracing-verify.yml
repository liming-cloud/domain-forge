# 仅供 scripts/verify_closure.sh 使用：临时加入 Jaeger 作为 OTLP 采集端，各服务导出全部链路，用于核对跨服务的完整链路。
# 部署参考不内置采集端（采集、存储与查询由业务项目提供，见 docs/architecture/10-链路追踪.md）。
x-tracing: &tracing
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: 1s
  DOMAINFORGE_TRACING_SAMPLINGPROBABILITY: "1.0"

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    restart: "no"
    networks: [backend]
  gateway:
    environment: *tracing
  iam:
    environment: *tracing
  note-service:
    environment: *tracing
  board-service:
    environment: *tracing
