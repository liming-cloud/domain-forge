# 单机 broker：proxy 以 local 模式内置在 broker 进程中（--enable-proxy），服务经 proxy 的 gRPC 端口 8081 连接。
# proxy 返回给客户端的路由地址是 brokerIP1，必须是服务能访问的地址：这里是 compose.yml 中 broker 的固定内网地址。
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerIP1=172.31.250.20
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 主题与消费组只由 rocketmq-init 按 topics.conf 创建，不自动创建（拼错的主题名会发送失败而不是静默新建）。
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
# 消息保留 72 小时，每天 04 点清理过期文件。
fileReservedTime=72
deleteWhen=04
storePathRootDir=/home/rocketmq/store
