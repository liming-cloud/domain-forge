# rocketmq-init 按此文件创建主题与消费组（可重复执行，已存在的会按此更新）。每行一项：
#   topic <主题名> NORMAL|FIFO            普通主题（不保证顺序）或顺序主题（同一顺序键按发布顺序投递）
#   group <消费组名> CONCURRENT|ORDERLY     并发消费组（订阅普通主题）或顺序消费组（订阅顺序主题）
# 消费组的最大重试次数统一为 4（共投递 5 次），与 domainforge.messaging.consumer.max-attempts 的默认值一致；
# 超过后服务端把消息转入死信队列 %DLQ%<消费组名>。模板生成带消息示例的服务时在下方追加。
