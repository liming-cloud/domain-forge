# 单机部署参考：Nginx 是唯一公开入口，经网关转发到各服务；其余服务只在 backend 网络内可达。
# 本地调试叠加 compose.local.yml（只在回环地址发布依赖端口）。用法见 deploy/README.md。
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: domainforge
      POSTGRES_USER: domainforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?provide POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U domainforge -d domainforge']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.8.1-trixie@sha256:c88d347edef6249a6d2293f926f1eeb48bd40c57cbcd02c07f52e7f1fd2cb46b
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?provide REDIS_PASSWORD}
    # 只保存会话、登录防护计数与缓存，不持久化：重启后所有用户需重新登录。
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --notify-keyspace-events E\$$gx --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no']
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 30
  nacos:
    # 只用作服务注册与发现；单机模式，内置存储持久化到卷，开启鉴权。
    image: nacos/nacos-server:v3.1.1@sha256:13e74786507abbacebe080fae2fc9c05aa2591eb99c97a0a78ff0e72beb21b13
    restart: unless-stopped
    logging: *logging
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?provide NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?provide NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?provide NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    volumes:
      - nacos-data:/home/nacos/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'curl -sf http://127.0.0.1:8848/nacos/v3/admin/core/state > /dev/null']
      interval: 3s
      timeout: 3s
      retries: 60
  nacos-init:
    # 一次性任务：设置管理员密码并创建服务专用账号，成功后退出。
    image: nacos/nacos-server:v3.1.1@sha256:13e74786507abbacebe080fae2fc9c05aa2591eb99c97a0a78ff0e72beb21b13
    restart: "no"
    logging: *logging
    entrypoint: [sh, /init/init.sh]
    environment:
      NACOS_ADMIN_PASSWORD: ${NACOS_ADMIN_PASSWORD:?provide NACOS_ADMIN_PASSWORD}
      NACOS_SERVICE_USERNAME: ${NACOS_SERVICE_USERNAME:-domainforge}
      NACOS_SERVICE_PASSWORD: ${NACOS_SERVICE_PASSWORD:?provide NACOS_SERVICE_PASSWORD}
    volumes:
      - ./nacos/init.sh:/init/init.sh:ro
      - ./nacos/config:/init/config:ro
    networks: [backend]
    depends_on:
      nacos:
        condition: service_healthy
  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    restart: unless-stopped
    logging: *logging
    command: [nameserver]
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'bash -c "exec 3<>/dev/tcp/127.0.0.1/9876"']
      interval: 3s
      timeout: 3s
      retries: 40
  rocketmq-store-init:
    # 一次性任务：镜像以 uid 3000 运行且没有预建存储目录，命名卷挂载点默认属于 root，先改属主。
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    restart: "no"
    user: "0:0"
    entrypoint: [chown, "3000:3000", /home/rocketmq/store]
    volumes:
      - rocketmq-store:/home/rocketmq/store
    networks: [backend]
  rocketmq-broker:
    # 消息与 Outbox 的传输：broker 内置 proxy（local 模式），服务经 gRPC 端口 8081 连接；不对外开放端口。
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    restart: unless-stopped
    logging: *logging
    command: [broker, --enable-proxy, -c, /etc/rocketmq/broker.conf, -pc, /etc/rocketmq/proxy.json]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    volumes:
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
      - ./rocketmq/proxy.json:/etc/rocketmq/proxy.json:ro
      - rocketmq-store:/home/rocketmq/store
    networks:
      backend:
        # 与 rocketmq/broker.conf 的 brokerIP1 一致：proxy 把它作为路由地址返回给客户端。
        ipv4_address: 172.31.250.20
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8081"']
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 40
  rocketmq-init:
    # 一次性任务：按 rocketmq/topics.conf 创建主题与消费组，等路由可见后退出。
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    restart: "no"
    logging: *logging
    entrypoint: [sh, /init/init.sh]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    volumes:
      - ./rocketmq/init.sh:/init/init.sh:ro
      - ./rocketmq/topics.conf:/init/topics.conf:ro
    networks: [backend]
    depends_on:
      rocketmq-broker:
        condition: service_healthy
  powerjob-db-init:
    # 一次性任务：建立 PowerJob 专用的数据库账号与同名 schema（与业务服务的 db-init 相同做法），可重复执行，
    # 每次把密码同步为环境文件中的值。表在 domainforge 库中，因此随 backup.sh 一并备份恢复。
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: domainforge
      PGDATABASE: domainforge
      PGPASSWORD: ${POSTGRES_PASSWORD:?provide POSTGRES_PASSWORD}
      SERVICE_DB_PASSWORD: ${POWERJOB_DB_PASSWORD:?provide POWERJOB_DB_PASSWORD}
    entrypoint: [sh, -c]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -q <<'SQL'
        \getenv service_password SERVICE_DB_PASSWORD
        SELECT 'CREATE ROLE powerjob' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'powerjob') \gexec
        ALTER ROLE powerjob WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD :'service_password';
        CREATE SCHEMA IF NOT EXISTS powerjob AUTHORIZATION powerjob;
        SQL
        echo "powerjob database account ready"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
  powerjob-server:
    # 定时任务调度（PowerJob）：任务登记、周期、暂停／恢复、手动触发与执行记录；控制台经 compose.console.yml 访问。
    # 官方镜像运行时为 Java 8；只用 HTTP 通信，对外声明固定地址供各服务的 worker 连接。
    image: powerjob/powerjob-server:v5.1.7@sha256:2b1f7e86cc500668c39d870b1bfac40dbd795258736de2e4e7142766bf836d73
    restart: unless-stopped
    logging: *logging
    environment:
      JVMOPTIONS: -Xms256m -Xmx512m -Dpowerjob.network.external.address=172.31.250.30
      # PostgreSQL 需要 AdpPostgreSQLDialect：默认方言把大字段建成 oid，调度时报错。
      PARAMS: >-
        --spring.profiles.active=product
        --spring.datasource.core.driver-class-name=org.postgresql.Driver
        --spring.datasource.core.jdbc-url=jdbc:postgresql://postgres:5432/domainforge?currentSchema=powerjob
        --spring.datasource.core.username=powerjob
        --spring.datasource.core.password=${POWERJOB_DB_PASSWORD:?provide POWERJOB_DB_PASSWORD}
        --spring.datasource.remote.hibernate.properties.hibernate.dialect=tech.powerjob.server.persistence.config.dialect.AdpPostgreSQLDialect
        --oms.auth.initiliaze.admin.password=${POWERJOB_ADMIN_PASSWORD:?provide POWERJOB_ADMIN_PASSWORD}
        --oms.auth.openapi.enable=true
        --oms.transporter.active.protocols=HTTP
        --oms.transporter.main.protocol=HTTP
        --oms.instanceinfo.retention=30
    networks:
      backend:
        # 与 JVMOPTIONS 中的对外地址一致：worker 按它连接服务端。
        ipv4_address: 172.31.250.30
    depends_on:
      powerjob-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'curl -sf -o /dev/null http://127.0.0.1:7700/auth/supportLoginTypes']
      interval: 3s
      timeout: 3s
      start_period: 60s
      retries: 60
  powerjob-init:
    # 一次性任务：创建命名空间并按 powerjob/apps.conf 注册各服务的应用，成功后退出。
    image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    restart: "no"
    logging: *logging
    entrypoint: [sh, /init/init.sh]
    environment:
      POWERJOB_ADMIN_PASSWORD: ${POWERJOB_ADMIN_PASSWORD:?provide POWERJOB_ADMIN_PASSWORD}
      POWERJOB_APP_PASSWORD: ${POWERJOB_APP_PASSWORD:?provide POWERJOB_APP_PASSWORD}
    volumes:
      - ./powerjob/init.sh:/init/init.sh:ro
      - ./powerjob/apps.conf:/init/apps.conf:ro
    networks: [backend]
    depends_on:
      powerjob-server:
        condition: service_healthy
  iam:
    image: domain-forge/iam:${IAM_IMAGE_TAG:-local}
    build:
      context: ./jvm
      additional_contexts:
        dist: ../platform/services/iam/target
    restart: unless-stopped
    logging: *logging
    environment:
      IAM_DB_URL: jdbc:postgresql://postgres:5432/domainforge
      IAM_DB_USER: domainforge
      IAM_DB_PASSWORD: ${POSTGRES_PASSWORD:?provide POSTGRES_PASSWORD}
      IAM_REDIS_HOST: redis
      IAM_REDIS_PORT: "6379"
      IAM_REDIS_PASSWORD: ${REDIS_PASSWORD:?provide REDIS_PASSWORD}
      IAM_FINGERPRINT_KEY: ${IAM_FINGERPRINT_KEY:?provide IAM_FINGERPRINT_KEY}
      IAM_DISCOVERY_ENABLED: "true"
      # 配置中心：读取 Nacos 中的 iam.yaml（种子见 nacos/config/），不可达或未发布时启动失败。
      SPRING_PROFILES_ACTIVE: config-center
      IAM_NACOS_SERVER_ADDR: nacos:8848
      IAM_NACOS_USERNAME: ${NACOS_SERVICE_USERNAME:-domainforge}
      IAM_NACOS_PASSWORD: ${NACOS_SERVICE_PASSWORD:?provide NACOS_SERVICE_PASSWORD}
      # 只信任网关固定地址给出的 X-Forwarded-For（网关已按 Nginx 给出的值确定客户端地址），登录防护按真实客户端地址计数。
      SERVER_FORWARDHEADERSSTRATEGY: NATIVE
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: '172\.31\.250\.11'
      # 定时任务：IAM 的过期数据清理由 PowerJob 调度（应用 iam 由 powerjob-init 注册）。
      IAM_SCHEDULING_ENABLED: "true"
      IAM_SCHEDULING_SERVER_ADDRESS: powerjob-server:7700
      IAM_SCHEDULING_APP_PASSWORD: ${POWERJOB_APP_PASSWORD:?provide POWERJOB_APP_PASSWORD}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      powerjob-init:
        condition: service_completed_successfully
    healthcheck:
      # 管理端口只绑定容器内回环地址，不对网络开放。
      test: [CMD-SHELL, 'curl -sf http://127.0.0.1:9091/actuator/health/readiness > /dev/null']
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
  gateway:
    # API 网关：路由（Nacos 中的 gateway.yaml）、登录前置校验、限流、请求标识，并为转发的请求写入 Same-Token。
    image: domain-forge/gateway:${GATEWAY_IMAGE_TAG:-local}
    build:
      context: ./jvm
      additional_contexts:
        dist: ../platform/services/gateway/target
    restart: unless-stopped
    logging: *logging
    environment:
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD:?provide REDIS_PASSWORD}
      GATEWAY_DISCOVERY_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: config-center
      GATEWAY_NACOS_SERVER_ADDR: nacos:8848
      GATEWAY_NACOS_USERNAME: ${NACOS_SERVICE_USERNAME:-domainforge}
      GATEWAY_NACOS_PASSWORD: ${NACOS_SERVICE_PASSWORD:?provide NACOS_SERVICE_PASSWORD}
      # 只采用 Nginx 固定地址给出的 X-Forwarded-For。
      GATEWAY_TRUSTED_PROXIES: 172.31.250.10
    networks:
      backend:
        ipv4_address: 172.31.250.11
    depends_on:
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      # 管理端口只绑定容器内回环地址，不对网络开放。
      test: [CMD-SHELL, 'curl -sf http://127.0.0.1:9093/actuator/health/readiness > /dev/null']
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
  nginx:
    image: nginx:1.30-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    logging: *logging
    ports: ["${NGINX_HTTP_BIND:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/domain-forge/proxy.inc:ro
      - ./nginx/locations.inc:/etc/nginx/domain-forge/locations.inc:ro
    networks:
      backend:
        ipv4_address: 172.31.250.10
    depends_on:
      gateway:
        condition: service_healthy
      # 入口在消息主题建好后才开放；也让 `up --wait` 把一次性任务 rocketmq-init 的正常退出当作完成
      # （没有任何服务依赖的一次性任务退出时，--wait 会判失败）。
      rocketmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/healthz']
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    # Nginx 的固定地址与网关的可信代理一致，网关的固定地址与各后端的可信代理一致；修改网段时同步修改。
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  postgres-data:
  nacos-data:
  # 消息存储：不进入备份。Outbox 在 PostgreSQL 中，是待发送事件的权威来源；丢失该卷会丢失已发送、尚未消费的消息。
  rocketmq-store:
