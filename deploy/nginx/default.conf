# 唯一公开入口：IAM 的 /api/ 与各业务服务登记的公开前缀；/internal/、管理端点和其他路径一律不对外。
server_tokens off;
# Docker 内置 DNS；按变量转发，后端重建换地址后无需重启 Nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # 业务服务的公开前缀（模板生成到 deploy/nginx/services/<服务名>.conf），比 /api/ 更具体，优先匹配。
    include /etc/nginx/domain-forge/services/*.conf;

    location /api/ {
        set $iam_upstream http://iam:8080;
        proxy_pass $iam_upstream;
        include /etc/nginx/domain-forge/proxy.inc;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
