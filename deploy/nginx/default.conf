# 唯一公开入口：/api/ 全部转发到网关，由网关按路由分发到各服务；/internal/、管理端点和其他路径一律不对外。
server_tokens off;
# Docker 内置 DNS；按变量转发，后端重建换地址后无需重启 Nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    location /api/ {
        set $gateway_upstream http://gateway:8000;
        proxy_pass $gateway_upstream;
        include /etc/nginx/domain-forge/proxy.inc;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
