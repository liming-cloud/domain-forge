spring.application.name=iam
# 本地 IAM 身份用例可独立运行；微服务部署显式启用原生注册，不建立第二套发现来源。
spring.cloud.nacos.discovery.enabled=${IAM_DISCOVERY_ENABLED:false}
spring.cloud.nacos.discovery.server-addr=${IAM_NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${IAM_NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${IAM_NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${IAM_NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${IAM_NACOS_PASSWORD:}
spring.cloud.nacos.discovery.ip=${IAM_DISCOVERY_IP:}
spring.cloud.nacos.discovery.secure=true
spring.datasource.url=${IAM_DB_URL}
spring.datasource.username=${IAM_DB_USER}
spring.datasource.password=${IAM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
mybatis-plus.configuration.default-statement-timeout=5
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.local-cache-scope=STATEMENT
spring.transaction.default-timeout=10s
iam.fingerprint-key=${IAM_FINGERPRINT_KEY}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=16KB
management.server.address=127.0.0.1
management.server.port=${IAM_MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.status.order=down,out-of-service,unknown,up
spring.data.redis.host=${IAM_REDIS_HOST}
spring.data.redis.port=${IAM_REDIS_PORT}
spring.data.redis.password=${IAM_REDIS_PASSWORD}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.is-read-cookie=false
sa-token.is-read-body=false
sa-token.is-share=false
sa-token.is-concurrent=true
sa-token.is-log=false
sa-token.timeout=28800
sa-token.active-timeout=-1
sa-token.auto-renew=false
sa-token.is-print=false
iam.project-id=${IAM_PROJECT_ID}
iam.trusted-service-identities=${IAM_TRUSTED_SERVICE_IDENTITIES}
server.ssl.enabled=true
server.ssl.key-store=${IAM_SERVER_KEYSTORE}
server.ssl.key-store-password=${IAM_SERVER_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=${IAM_TRUSTSTORE}
server.ssl.trust-store-password=${IAM_TRUSTSTORE_PASSWORD}
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=want
server.tomcat.connection-timeout=5s
springdoc.api-docs.enabled=${IAM_API_DOCS_ENABLED:false}
spring.jackson.deserialization.fail-on-unknown-properties=true

# 默认值只在此处定义；共享策略修改须经login-policy显式切换。
iam.login-protection.account-attempts=${IAM_LOGIN_ACCOUNT_ATTEMPTS:5}
iam.login-protection.account-window-seconds=${IAM_LOGIN_ACCOUNT_WINDOW_SECONDS:600}
iam.login-protection.address-attempts=${IAM_LOGIN_ADDRESS_ATTEMPTS:30}
iam.login-protection.address-window-seconds=${IAM_LOGIN_ADDRESS_WINDOW_SECONDS:60}
iam.login-protection.hash-workers=${IAM_LOGIN_HASH_WORKERS:2}
iam.login-protection.hash-queue-capacity=${IAM_LOGIN_HASH_QUEUE_CAPACITY:8}
iam.login-protection.hash-wait-millis=${IAM_LOGIN_HASH_WAIT_MILLIS:1000}
