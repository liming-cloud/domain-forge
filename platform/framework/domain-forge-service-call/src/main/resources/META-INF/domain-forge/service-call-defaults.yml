# 跨服务调用组件默认值：所有 Feign 客户端的超时与重定向；服务可按客户端覆盖（spring.cloud.openfeign.client.config.<contextId>）。
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000
            follow-redirects: false
    loadbalancer:
      # 负载均衡层也不重试：结果未知的请求不自动重放。
      retry:
        enabled: false
      # 不缓存实例列表（默认 35 秒）：Nacos 发现客户端已订阅变更推送，叠加缓存会让被调服务重建后旧地址多活 35 秒。
      cache:
        enabled: false
