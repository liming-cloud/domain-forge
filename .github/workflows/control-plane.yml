name: 控制面机制与隔离门禁校准

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-checks:
    name: 文档一致性与本次变更范围（非任务验收）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      maintenance-required: ${{ steps.scope.outputs.maintenance-required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: 文档结构与控制面有效反例
        run: |
          python -B tools/control_plane/control_plane.py check
          python -B -m unittest discover -s tools/control_plane -p 'test_*.py'
      - name: 由事件差异选择校准，不读取长期任务的历史范围
        id: scope
        env:
          TASK_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
        shell: bash
        run: |
          python -B tools/control_plane/control_plane.py ci-plan --base "$TASK_EVENT_BASE" > "$RUNNER_TEMP/domain-forge-ci-plan.json"
          echo "maintenance-required=$(jq -r .maintenance_required "$RUNNER_TEMP/domain-forge-ci-plan.json")" >> "$GITHUB_OUTPUT"
  advisory-data:
    name: 原生依赖告警资料准备（独立预算，非产品扫描）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: scope-checks
    if: needs.scope-checks.outputs.maintenance-required == 'true'
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    env:
      DOMAIN_FORGE_GATE_ADVISORY_DATA: ${{ runner.temp }}/domain-forge-advisory-data
      DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY: ${{ runner.temp }}/domain-forge-advisory-repository
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: 当前准备的唯一原生缓存键
        id: cache-key
        shell: bash
        run: echo "value=${{ runner.os }}-domain-forge-odc-${{ hashFiles('tools/engineering_gate/maven-dependency-check.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: 复用同版本原生资料及 Maven 插件缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_DATA }}
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY }}
          key: ${{ steps.cache-key.outputs.value }}
          restore-keys: ${{ runner.os }}-domain-forge-odc-${{ hashFiles('tools/engineering_gate/maven-dependency-check.xml') }}-
      - name: 准备固定 Maven 并执行原生资料更新（失败或超时不放行）
        shell: bash
        run: |
          TASK_MAVEN_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-advisory-maven.XXXXXX")"
          python -B tools/engineering_gate/calibrate_maven.py --prepare "$TASK_MAVEN_ROOT" > "$RUNNER_TEMP/domain-forge-advisory-maven.json"
          TASK_ADVISORY_MAVEN="$(jq -r .maven_home "$RUNNER_TEMP/domain-forge-advisory-maven.json")"
          mkdir -p "$DOMAIN_FORGE_GATE_ADVISORY_DATA" "$DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY"
          python -B tools/engineering_gate/calibrate_advisory.py --prepare "$DOMAIN_FORGE_GATE_ADVISORY_DATA" --maven-home "$TASK_ADVISORY_MAVEN"
          python -B tools/engineering_gate/calibrate_advisory.py --environment --maven-home "$TASK_ADVISORY_MAVEN"
      - name: 仅保存成功准备的原生缓存
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_DATA }}
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY }}
          key: ${{ steps.cache-key.outputs.value }}
  mechanism-checks:
    name: 隔离门禁校准 / ${{ matrix.group }}（非整套验收）
    needs: advisory-data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [source, build, architecture, dependencies, roles, methods, http, credentials, policies, passwords, migration, persistence-routing, persistence-state, runtime]
    env:
      DOMAIN_FORGE_GATE_TOOLS: ${{ runner.temp }}/domain-forge-engineering-tools
      DOMAIN_FORGE_GATE_ADVISORY_DATA: ${{ runner.temp }}/domain-forge-advisory-data
      DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY: ${{ runner.temp }}/domain-forge-advisory-repository
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          # 官方 SemVer；实际发行是 21.0.12.1+1，四段版本不是该 Action 的合法输入。
          java-version: '21.0.12+101.0.LTS'
      - name: 获取固定校准工具并核对实际运行时
        run: python -B tools/engineering_gate/calibrate_source.py prepare
      - name: 准备固定 Maven 编译校准环境（不是产品版本基线）
        shell: bash
        run: |
          TASK_MAVEN_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-maven.XXXXXX")"
          python -B tools/engineering_gate/calibrate_maven.py --prepare "$TASK_MAVEN_ROOT" > "$RUNNER_TEMP/domain-forge-maven-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_MAVEN=\(.maven_home)", "DOMAIN_FORGE_GATE_MAVEN_REPOSITORY=\(.repository)"' "$RUNNER_TEMP/domain-forge-maven-runtime.json" >> "$GITHUB_ENV"
      - name: 准备固定官方 Wrapper 发行（仅隔离机制校准）
        shell: bash
        run: |
          TASK_WRAPPER_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-wrapper.XXXXXX")"
          python -B tools/engineering_gate/calibrate_wrapper.py --prepare "$TASK_WRAPPER_ROOT" > "$RUNNER_TEMP/domain-forge-wrapper-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_WRAPPER=\(.wrapper_archive)"' "$RUNNER_TEMP/domain-forge-wrapper-runtime.json" >> "$GITHUB_ENV"
      - name: 取得本轮成功准备的原生缓存（缺失即失败）
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_DATA }}
            ${{ env.DOMAIN_FORGE_GATE_ADVISORY_REPOSITORY }}
          key: ${{ needs.advisory-data.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: 核对固定原生插件及资料环境
        run: python -B tools/engineering_gate/calibrate_advisory.py --environment
      - name: 准备固定 HTTP 校准库与 Boot 4 隔离依赖
        shell: bash
        run: |
          TASK_HTTP_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-http.XXXXXX")"
          python -B tools/engineering_gate/calibrate_http.py --prepare "$TASK_HTTP_ROOT" > "$RUNNER_TEMP/domain-forge-http-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_HTTP_TOOLS=\(.http_tools)"' "$RUNNER_TEMP/domain-forge-http-runtime.json" >> "$GITHUB_ENV"
      - name: 准备固定 Sa-Token Boot 4 隔离依赖
        shell: bash
        run: |
          TASK_ACCESS_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-access.XXXXXX")"
          python -B tools/engineering_gate/calibrate_access.py --prepare "$TASK_ACCESS_ROOT" > "$RUNNER_TEMP/domain-forge-access-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_ACCESS_TOOLS=\(.access_tools)"' "$RUNNER_TEMP/domain-forge-access-runtime.json" >> "$GITHUB_ENV"
      - name: 准备固定 Argon2id 隔离依赖
        shell: bash
        run: |
          TASK_PASSWORD_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-password.XXXXXX")"
          python -B tools/engineering_gate/calibrate_password.py --prepare "$TASK_PASSWORD_ROOT" > "$RUNNER_TEMP/domain-forge-password-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_PASSWORD_TOOLS=\(.password_tools)"' "$RUNNER_TEMP/domain-forge-password-runtime.json" >> "$GITHUB_ENV"
      - name: 当前任务与实际变更的最低规则清单
        run: python -B tools/control_plane/control_plane.py route --task control-plane-verification
      - name: 准备固定启动迁移依赖与临时数据库镜像
        if: matrix.group == 'migration' || matrix.group == 'persistence-routing' || matrix.group == 'persistence-state' || matrix.group == 'credentials' || matrix.group == 'policies' || matrix.group == 'passwords'
        shell: bash
        run: |
          TASK_MIGRATION_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-migration.XXXXXX")"
          python -B tools/engineering_gate/calibrate_flyway.py --prepare "$TASK_MIGRATION_ROOT" > "$RUNNER_TEMP/domain-forge-migration-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_MIGRATION_TOOLS=\(.migration_tools)"' "$RUNNER_TEMP/domain-forge-migration-runtime.json" >> "$GITHUB_ENV"
      - name: 准备固定 MyBatis-Plus 与动态数据源运行依赖
        if: matrix.group == 'persistence-routing' || matrix.group == 'persistence-state'
        shell: bash
        run: |
          TASK_PERSISTENCE_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-persistence.XXXXXX")"
          python -B tools/engineering_gate/calibrate_persistence.py --prepare "$TASK_PERSISTENCE_ROOT" > "$RUNNER_TEMP/domain-forge-persistence-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_PERSISTENCE_TOOLS=\(.persistence_tools)"' "$RUNNER_TEMP/domain-forge-persistence-runtime.json" >> "$GITHUB_ENV"
      - name: 准备访问状态依赖与本轮 Redis 和 PostgreSQL 镜像
        if: matrix.group == 'credentials' || matrix.group == 'policies' || matrix.group == 'passwords'
        shell: bash
        run: |
          TASK_ACCESS_STATE_ROOT="$(mktemp -d "$RUNNER_TEMP/domain-forge-access-state.XXXXXX")"
          python -B tools/engineering_gate/calibrate_access_state.py --prepare "$TASK_ACCESS_STATE_ROOT" > "$RUNNER_TEMP/domain-forge-access-state-runtime.json"
          jq -r '"DOMAIN_FORGE_GATE_ACCESS_STATE_TOOLS=\(.access_state_tools)"' "$RUNNER_TEMP/domain-forge-access-state-runtime.json" >> "$GITHUB_ENV"
      - name: 准备运行配置与原生观测依赖及私有服务镜像
        if: matrix.group == 'runtime'
        shell: bash
        run: |
          TASK_RUNTIME_ROOT=$(mktemp -d)
          python -B tools/engineering_gate/calibrate_runtime.py --prepare "$TASK_RUNTIME_ROOT" > "$RUNNER_TEMP/domain-forge-runtime-environment.json"
          jq -r '"DOMAIN_FORGE_GATE_RUNTIME_TOOLS=\(.runtime_tools)"' "$RUNNER_TEMP/domain-forge-runtime-environment.json" >> "$GITHUB_ENV"
      - name: 实际注释格式与固定分组覆盖
        if: matrix.group == 'source'
        run: python -B tools/engineering_gate/test_source_probe.py SourceProbeCommands SourcePartitionChecks
      - name: 实际指标范围与工具输入校准
        if: matrix.group == 'source'
        run: python -B tools/engineering_gate/test_source_probe.py SourceMetricBehaviorSuite
      - name: 实际工具输入及计量覆盖校准
        if: matrix.group == 'source'
        run: python -B tools/engineering_gate/test_source_probe.py SourceInputSuite
      - name: 已确认数值基线与损坏配置反例
        if: matrix.group == 'source'
        run: python -B -m unittest discover -s tools/engineering_gate -p 'test_complexity_baseline.py'
      - name: 实际字节码与精确合同反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_architecture_probe.py ArchitecturePolicySuite ArchitecturePartitionChecks
      - name: 实际合同完整性、输入拒绝及适配器自身质量反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_architecture_probe.py ArchitectureIntegritySuite
      - name: 基础 Maven 插件固定版本与告警配置（非产品扫描）
        if: matrix.group == 'dependencies'
        run: python -B -m unittest discover -s tools/engineering_gate -p 'test_maven_advisory.py'
      - name: 原生正常扫描、漏洞告警、资料失败及整改反例（非产品扫描）
        if: matrix.group == 'dependencies'
        run: python -B -m unittest discover -s tools/engineering_gate -p 'test_advisory_runtime.py'
      - name: 真实 Maven 编译范围、漏扫、跳过及陈旧输出反例
        if: matrix.group == 'build'
        run: python -B -m unittest discover -s tools/engineering_gate -p 'test_maven_scope.py'
      - name: 官方 Wrapper 真实启动、原生摘要拒绝与篡改反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_wrapper.py MavenWrapperCommands
      - name: 官方 Wrapper verify、真实断言失败及生命周期完整分组
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleExecutionCommands MavenLifecyclePartitionChecks
      - name: 必需测试漏选、跳过、无发现及忽略失败反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleTestCoverageCommands
      - name: 必需生命周期目标与真实 JAR 类产物反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleArtifactCommands
      - name: 实际编译目标与必需插件版本反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleVersionCommands
      - name: 原生项目和插件依赖约束、传递范围及快照反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleResolutionCommands
      - name: 必需测试合同及陈旧输出拒绝反例
        if: matrix.group == 'build'
        run: python -B tools/engineering_gate/test_maven_lifecycle.py MavenLifecycleInputCommands
      - name: 真实编译用途绑定注释、格式及复杂度反例
        if: matrix.group == 'source'
        run: python -B tools/engineering_gate/test_maven_source.py MavenSourceStructureSuite MavenSourcePartitionChecks
      - name: 真实编译用途绑定数值、无显式实现及基线反例
        if: matrix.group == 'source'
        run: python -B tools/engineering_gate/test_maven_source.py MavenSourceMetricSuite
      - name: 真实精确合同、跨模块访问及固定分组反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_maven_architecture.py MavenArchitectureContractSuite MavenArchitecturePartitionChecks
      - name: 真实默认职责、必要装配事务注解及固定分组反例
        if: matrix.group == 'roles'
        run: python -B tools/engineering_gate/test_role_boundaries.py RoleBoundaryPolicySuite RoleBoundaryPartitionChecks
      - name: 组合注解、类字面量及静态导入操作反例
        if: matrix.group == 'roles'
        run: python -B tools/engineering_gate/test_role_boundaries.py RoleBoundaryUsageSuite
      - name: 非公开、局部匿名职责及未知技术校准边界反例
        if: matrix.group == 'roles'
        run: python -B tools/engineering_gate/test_role_boundaries.py RoleBoundaryOwnershipSuite
      - name: 职责声明、精确配置及原生源码位置观察反例
        if: matrix.group == 'roles'
        run: python -B tools/engineering_gate/test_role_boundaries.py RoleBoundaryInputSuite
      - name: 真实 MyBatis-Plus 类型、映射注解与数据合同隔离反例
        if: matrix.group == 'roles'
        run: python -B tools/engineering_gate/test_persistence_boundaries.py
      - name: 真实模块归属与编译用途来源反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_maven_architecture.py MavenArchitecturePurposeSuite
      - name: 真实源码及类产物来源绑定、输入与缺失信息反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_maven_architecture.py MavenArchitectureBindingSuite
      - name: 原生构建类路径、真实第三方库、用途及依赖漂移反例
        if: matrix.group == 'architecture'
        run: python -B tools/engineering_gate/test_maven_architecture.py MavenArchitectureClasspathSuite
      - name: 直接依赖、官方能力 API 及校准版本边界反例
        if: matrix.group == 'dependencies'
        run: python -B tools/engineering_gate/test_dependency_declarations.py DependencyDeclarationEntrySuite DependencyDeclarationPartitionChecks
      - name: 源码注解、内联常量、SDK 继承及 BOM 反例
        if: matrix.group == 'dependencies'
        run: python -B tools/engineering_gate/test_dependency_declarations.py DependencyDeclarationSourceSuite
      - name: 原生直接身份、能力用途及无效配置拒绝反例
        if: matrix.group == 'dependencies'
        run: python -B tools/engineering_gate/test_dependency_declarations.py DependencyDeclarationInputSuite
      - name: 精确合同方法说明、位置与固定分组反例
        if: matrix.group == 'methods'
        run: python -B tools/engineering_gate/test_method_contracts.py MethodCommentSuite MethodContractPartitionChecks
      - name: 合同擦除签名及显式构造器来源反例
        if: matrix.group == 'methods'
        run: python -B tools/engineering_gate/test_method_contracts.py MethodSourceBindingSuite
      - name: 真实说明继承及可见性降低反例
        if: matrix.group == 'methods'
        run: python -B tools/engineering_gate/test_method_contracts.py MethodInheritanceSuite
      - name: 真实 Boot 4 注册、生成、适配器质量与完整分组
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpGenerationCommands HttpToolQualityChecks HttpPartitionChecks
      - name: 真实 POST、请求结构拒绝、继承与组合路由
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpRequestCommands
      - name: 实际查询参数及成熟请求验证器
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpParameterCommands
      - name: 真实响应漂移与独立发布合同不兼容反例
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpDriftCommands
      - name: 三字段外壳、空数据与业务拒绝不得伪装成功
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpEnvelopeCommands
      - name: 合同版本、发布摘要、场景覆盖、工具与 HTTP 状态反例
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpInputCommands
      - name: 未校准路由及全部跳过请求合同的拒绝反例
        if: matrix.group == 'http'
        run: python -B tools/engineering_gate/test_http_contract.py HttpScopeCommands
      - name: 原生 Bearer Header、拒绝渠道、前缀及完整分组
        if: matrix.group == 'credentials'
        run: python -B tools/engineering_gate/test_sa_access.py AccessTransportCommands AccessPartitionChecks
      - name: 参数和 Cookie 取令牌误配置及真实拒绝反例
        if: matrix.group == 'credentials'
        run: python -B tools/engineering_gate/test_sa_access.py AccessConfigurationCommands
      - name: 渠道伪装、仅有注解而拦截未执行及整改反例
        if: matrix.group == 'credentials'
        run: python -B tools/engineering_gate/test_sa_access.py AccessCoverageCommands
      - name: 缺失、重复、未执行场景和原生工具缺失反例
        if: matrix.group == 'credentials'
        run: python -B tools/engineering_gate/test_sa_access.py AccessInputCommands
      - name: 原生匿名、登录、权限声明与策略观察器质量及完整分组
        if: matrix.group == 'policies'
        run: python -B tools/engineering_gate/test_sa_policy.py PolicyBehaviorCommands PolicyToolQualityChecks PolicyPartitionChecks
      - name: 原生策略遗漏、空权限及统一默认拒绝反例
        if: matrix.group == 'policies'
        run: python -B tools/engineering_gate/test_sa_policy.py PolicyCoverageCommands
      - name: 鉴权未执行、组合解析缺失及处理器替换反例
        if: matrix.group == 'policies'
        run: python -B tools/engineering_gate/test_sa_policy.py PolicyExecutionCommands
      - name: 原生策略场景、身份见证、覆盖与意图漂移反例
        if: matrix.group == 'policies'
        run: python -B tools/engineering_gate/test_sa_policy.py PolicyInputCommands
      - name: 实际 Argon2id 输入行为、适配器质量与完整分组
        if: matrix.group == 'passwords'
        run: python -B tools/engineering_gate/test_password.py PasswordBehaviorCommands PasswordToolQualityChecks PasswordPartitionChecks
      - name: 明文、快速哈希、复用盐及伪造摘要反例
        if: matrix.group == 'passwords'
        run: python -B tools/engineering_gate/test_password.py PasswordRejectionCommands
      - name: 密码材料输出、无效声明及缺失环境反例
        if: matrix.group == 'passwords'
        run: python -B tools/engineering_gate/test_password.py PasswordInputCommands
      - name: 真实启动迁移、重启升级、观察器质量与固定分组
        if: matrix.group == 'migration'
        run: python -B tools/engineering_gate/test_flyway.py MigrationBehaviorCommands MigrationToolQualityChecks MigrationPartitionChecks
      - name: 错误 SQL 路径、结构漂移和关闭迁移反例
        if: matrix.group == 'migration'
        run: python -B tools/engineering_gate/test_flyway.py MigrationRejectionCommands
