name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify（架构规则、格式、单元与集成测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与验证
        run: platform/mvnw -f platform/pom.xml -B -ntp -T 1C verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log
      - name: 保存测试报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports
          path: |
            platform/**/target/surefire-reports/
            platform/**/target/failsafe-reports/
            platform/**/target/checkstyle-*.xml
          retention-days: 7

  template:
    name: 服务模板（生成、构建与接入验证）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 生成器单元测试
        run: python3 -m unittest discover -s platform/templates/ddd-service -p 'test_*.py'
      - name: 在干净副本中生成示例服务并执行完整门禁
        run: scripts/verify_template.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log

  deploy:
    name: 部署参考（启动、重启、备份与恢复）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 在独立 Compose 项目中验证部署、重启、备份与恢复
        env:
          DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
        run: scripts/verify_deploy.sh base
      - name: 保存容器日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deploy-diagnostics
          path: diagnostics/
          retention-days: 7

  deploy-ops:
    name: 部署参考（配置中心、升级与回退、HTTPS）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 在独立 Compose 项目中验证配置中心、升级与回退、HTTPS
        env:
          DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
        run: scripts/verify_deploy.sh ops
      - name: 保存容器日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deploy-ops-diagnostics
          path: diagnostics/
          retention-days: 7

  closure:
    name: MVP 闭环（模板服务接入 IAM 并部署）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 生成服务、与 IAM 一起部署并走完授权链路
        env:
          DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
        run: scripts/verify_closure.sh
      - name: 保存容器日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: closure-diagnostics
          path: diagnostics/
          retention-days: 7

  docs:
    name: 文档链接
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 检查相对链接与锚点
        run: python3 scripts/check_doc_links.py
      - name: 删除平台专有资产后的引用与链接（起步清单演练）
        run: scripts/verify_starter.sh --docs-only
      - name: Claude Code 钩子自测（拦截 main 上提交与强推）
        run: scripts/test_guard_git.sh

  guard:
    name: 过程守卫（PR 标题前缀、WIP 提交）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 检查标题前缀与 WIP 提交
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check_pr_guard.sh "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA"
