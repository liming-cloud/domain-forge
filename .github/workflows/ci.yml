name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify（架构规则、格式、单元与集成测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与验证
        run: platform/mvnw -f platform/pom.xml -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log
      - name: 保存测试报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            platform/**/target/surefire-reports/
            platform/**/target/failsafe-reports/
            platform/**/target/checkstyle-*.xml
          retention-days: 7

  template:
    name: 服务模板（生成、构建与接入验证）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 生成器单元测试
        run: python3 -m unittest discover -s platform/templates/ddd-service -p 'test_*.py'
      - name: 在干净副本中生成示例服务并执行完整门禁
        run: scripts/verify_template.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log

  docs:
    name: 文档链接
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 检查相对链接与锚点
        run: python3 scripts/check_doc_links.py
