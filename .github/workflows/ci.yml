name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify（架构规则、格式、单元与集成测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与验证
        run: platform/mvnw -f platform/pom.xml -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log
      - name: 保存测试报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports
          path: |
            platform/**/target/surefire-reports/
            platform/**/target/failsafe-reports/
            platform/**/target/checkstyle-*.xml
          retention-days: 7

  template:
    name: 服务模板（生成、构建与接入验证）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 生成器单元测试
        run: python3 -m unittest discover -s platform/templates/ddd-service -p 'test_*.py'
      - name: 在干净副本中生成示例服务并执行完整门禁
        run: scripts/verify_template.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: 失败摘要
        if: failure()
        run: scripts/report_failures.sh platform build.log

  docs:
    name: 文档链接
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 检查相对链接与锚点
        run: python3 scripts/check_doc_links.py
