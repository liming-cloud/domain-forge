name: 不稳定测试
description: 同一代码时而通过时而失败的测试；先搜索已有 issue，有则追加记录
title: "[Flaky test] "
labels: ["kind/flake"]
body:
  - type: input
    id: test
    attributes:
      label: 测试
      description: 类名与方法名
    validations:
      required: true
  - type: textarea
    id: runs
    attributes:
      label: 出现记录
      description: 每次失败的 CI 运行链接，以及是否与当次改动无关
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 失败测试的完整日志，不只是断言行
      render: text
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 处理
      description: 再次出现且未修复时先隔离（禁用并在注释中链接本 issue），再定位根因
      value: |
        - [ ] 定位根因
        - [ ] 修复（产品代码问题同时加 kind/bug）
