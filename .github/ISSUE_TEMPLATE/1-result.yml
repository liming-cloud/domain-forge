name: 结果
description: 一项能验收的完整结果，由 PR 交付；过程中的修复、决定、文档、测试都放进同一个 PR
title: ""
labels: ["kind/result", "status/needs-decision"]
body:
  - type: markdown
    attributes:
      value: 描述是唯一的事实来源，进度和决定更新在描述里，不靠评论。流程见 AGENTS.md。建好后选里程碑；未决问题全部答复后，把 `status/needs-decision` 换成 `status/ready`。
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 交付什么结果、解决什么问题、为什么现在做；对应哪个里程碑或产品验收场景
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 已确认的决定
      description: 已由人答复的决定，链接决策记录；没有写“无”
  - type: textarea
    id: questions
    attributes:
      label: 未决问题
      description: 需要人决定的事（见 AGENTS.md），附建议。答复后勾选，并写进决策记录；没有写“无”
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 每条写明怎么验证：测试名、命令或脚本、指标和门槛（几轮）、或手工步骤和记录位置
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 改动范围
      description: 主要改动和涉及的模块、入口；明确不做的事和不能碰的部分；涉及界面的先做原型
    validations:
      required: true
  - type: textarea
    id: start
    attributes:
      label: 开工
      description: 前置 Issue（要先合并的，同时用 blocked by 标注）、分支名、第一步、已知风险；新会话从这里接着做
  - type: textarea
    id: history
    attributes:
      label: 实施记录
      description: PR 链接；质量类结果写每轮测量数据的摘要
